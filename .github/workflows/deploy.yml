name: Deploy resume to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write     # lets the workflow request OIDC credentials
  contents: read      # lets it download the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585949317910:role/github-actions-frontend
          aws-region: us-east-2

      - name: Upload site to S3
        run: >
          aws s3 sync . s3://jesus-oyervides-cloud-resume
          --delete
          --exclude ".git/*"
          --exclude ".github/*"

      - name: Clear CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id E3LRH21MY57P1G
          --paths "/*"